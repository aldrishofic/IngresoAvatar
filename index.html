<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WELCOME</title>
<style>
:root {
  --bg-color: #19191a;
  --card-bg: #232325;
  --accent-color: #38bdf8;
  --accent-hover: #0284c7;
  --text-color: #f8fafc;
  --muted-text: #9ca3af;
  --success-color: #22c55e;
  --danger-color: #ef4444;
  --border-color: #323236;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

body {
  background-color: var(--bg-color);
  color: var(--text-color);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 1.5rem 1rem;
}

/* Pantalla de acceso privado */
#loginOverlay {
  position: fixed;
  inset: 0;
  background-color: #000000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  z-index: 9999;
  transition: opacity 0.35s ease;
}

#loginOverlay.hidden {
  opacity: 0;
  pointer-events: none;
}

.login-title {
  font-size: clamp(2rem, 7vw, 3.5rem);
  font-weight: 800;
  letter-spacing: 0.08em;
  color: #ffffff;
  text-align: center;
  margin-bottom: 1.5rem;
  text-transform: uppercase;
}

.login-form {
  width: 100%;
  max-width: 320px;
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
}

.login-input {
  width: 100%;
  padding: 12px 14px;
  font-size: 1rem;
  background-color: #111111;
  color: #ffffff;
  border: 1px solid #333333;
  border-radius: 8px;
  text-align: center;
  outline: none;
  transition: border-color 0.2s ease;
}

.login-input:focus {
  border-color: var(--accent-color);
}

.login-btn {
  width: 100%;
  padding: 12px;
  font-size: 1rem;
  font-weight: 700;
  background-color: #ffffff;
  color: #000000;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: background-color 0.2s ease, transform 0.1s ease;
}

.login-btn:hover {
  background-color: #e5e7eb;
}

.login-btn:active {
  transform: scale(0.98);
}

.login-error {
  color: var(--danger-color);
  font-size: 0.85rem;
  text-align: center;
  min-height: 1.2em;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  50% { transform: translateX(8px); }
  75% { transform: translateX(-6px); }
}

.shake {
  animation: shake 0.35s ease;
}

/* Contenido principal */
.app-wrapper {
  width: 100%;
  max-width: 550px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

header {
  width: 100%;
  position: relative;
  text-align: center;
  margin-bottom: 1.5rem;
}

h1 {
  font-size: 1.9rem;
  font-weight: 800;
  letter-spacing: 0.05em;
  margin-bottom: 0.4rem;
  color: var(--accent-color);
}

p.subtitle {
  color: var(--muted-text);
  font-size: 0.95rem;
}

.btn-lock {
  position: absolute;
  top: 0;
  right: 0;
  background: var(--card-bg);
  color: var(--muted-text);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 0.8rem;
  cursor: pointer;
  transition: color 0.2s ease, border-color 0.2s ease;
}

.btn-lock:hover {
  color: var(--text-color);
  border-color: #52525b;
}

.container {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.card {
  background-color: var(--card-bg);
  border-radius: 12px;
  padding: 1.25rem;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
}

.avatar-display {
  position: relative;
  width: 100%;
  aspect-ratio: 9 / 16;
  max-height: 420px;
  background-color: #000000;
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Doble reproductor superpuesto para fundido cruzado */
.avatar-video {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 0.4s ease-in-out;
  pointer-events: none;
}

.avatar-video.active {
  opacity: 1;
  pointer-events: auto;
}

.badge {
  position: absolute;
  top: 12px;
  left: 12px;
  background: rgba(25, 25, 26, 0.85);
  backdrop-filter: blur(4px);
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 0.85rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
  z-index: 10;
}

.indicator {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background-color: var(--muted-text);
}

.indicator.active {
  background-color: var(--success-color);
  box-shadow: 0 0 8px var(--success-color);
}

.inputs-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}

@media (max-width: 480px) {
  .inputs-grid {
    grid-template-columns: 1fr;
  }
}

.input-group {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.input-group label {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--accent-color);
}

input[type="file"] {
  font-size: 0.8rem;
  color: var(--muted-text);
  background: var(--bg-color);
  padding: 8px;
  border-radius: 6px;
  border: 1px solid var(--border-color);
  width: 100%;
}

.btn-test {
  padding: 6px 10px;
  font-size: 0.8rem;
  background: #2f2f33;
  color: var(--text-color);
  border: 1px solid #424247;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.2s ease;
}

.btn-test:hover {
  background: #3e3e44;
}

.controls {
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
  align-items: center;
}

button.btn-mic {
  width: 100%;
  padding: 12px;
  font-size: 1rem;
  font-weight: 600;
  border: none;
  border-radius: 8px;
  background-color: var(--accent-color);
  color: #19191a;
  cursor: pointer;
  transition: background-color 0.2s ease;
}

button.btn-mic.listening {
  background-color: var(--danger-color);
  color: white;
}

.command-log {
  font-size: 0.9rem;
  color: var(--muted-text);
  text-align: center;
  min-height: 1.5em;
}

.instructions {
  font-size: 0.85rem;
  color: var(--muted-text);
  line-height: 1.4;
}

.instructions ol {
  padding-left: 1.2rem;
  margin-top: 0.5rem;
}
</style>
</head>
<body>

<!-- Pantalla de bloqueo -->

  <div class="login-title">INGRESO CHACAL</div>
  <form class="login-form" id="loginForm">
    <input
      type="password"
      id="passwordInput"
      class="login-input"
      placeholder="Contraseña"
      autocomplete
